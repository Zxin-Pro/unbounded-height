plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "unbounded-height-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = '1.21.11'
        mappingsVersion = '2025.12.20'
    }
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Mixin：ModDevGradle 会自动接上 Mixin 注解处理器；
// 运行期由 META-INF/neoforge.mods.toml 的 [[mixins]] 段注册配置。
// （1.20.2+ / NeoForge 全版本运行期使用 official 名，不需要 refmap）

dependencies {
    // 配置是手写 JSON（Gson），显式声明以免依赖 Minecraft 传递进来的版本
    implementation 'com.google.code.gson:gson:2.10.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'Zxin-Pro',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Zxin-Pro'
        ])
    }
}
