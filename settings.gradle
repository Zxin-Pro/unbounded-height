pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // 让 Gradle 能自动解析编译用的 Java 工具链（Gradle 自身跑在更高版本 JDK 上）
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'unboundedheight-fabric-1.20.1'
